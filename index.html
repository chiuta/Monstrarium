  /** Chei cunoscute: fff.<slug>.*, cheile deja indexate în acest browser, cele declarate (fff-info storageKeys/bundleKeys, bundle.allow);

  function unknownKeys(keys) {
    var decl = declaredKeys(), idx = Object.create(null);

      if (k.indexOf(pfx) === 0 || idx[k] === 1) return false;
      if (F.store.appPrefix && k.indexOf(F.store.appPrefix) === 0) return false;   // modulul „store”: <slug>.*

        if (d.charAt(d.length - 1) === '*') return k.indexOf(d.slice(0, -1)) === 0;

    allow: function (list) { [].concat(list || []).forEach(function (x) { if (typeof x === 'string' && x) allowed.push(x); }); },
    build: function () { return plain(false); },

    redact: function (fn) { if (typeof fn === 'function') redactors.push(fn); },
    confirm: confirmDlg,

              {label: T('sens_plain'), value: 'plain'},
              {label: T('sens_enc'), value: 'enc', primary: true}

    inspect: function (file, opt) {

          '\n\n' + T('import_keys', {list: keyList(keys)}) +
          (unknown.length ? '\n\n' + T('import_unknown', {n: unknown.length, list: keyList(unknown)}) : '');

          .then(function (ok) {

            try {

    wipe: function (opt) {
      opt = opt || {};
      var keys = F.store.indexKeys();
      if (!keys.length) return Promise.resolve({keys: 0, cancelled: false});

        if (!ok) return {keys: 0, cancelled: true};

        try { F.store.raw.remove(F.store.indexKey); } catch (e) { /* ignorat */ }

        F.bus.emit('bundle:wiped', {keys: keys.length});
        if (opt.reload === true) setTimeout(function () { location.reload(); }, opt.delay == null ? 900 : opt.delay);
        return {keys: keys.length, cancelled: false};
      });
    }

<style>
:root{--bg:#fff8e7;--card:#ffffff;--ink:#2b2340;--mut:#6d6585;--acc:#7c3aed;--acc2:#15803d;--warn:#b45309;--line:#e6dcc3;--chip:#f1e8ff;--bar:#e9e2f7}
@media (prefers-color-scheme:dark){:root{--bg:#1a1530;--card:#262042;--ink:#f3eefc;--mut:#b2a8cc;--acc:#a78bfa;--acc2:#4ade80;--warn:#fbbf24;--line:#3b3360;--chip:#352c5c;--bar:#3b3360}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:0 14px}
header{padding:18px 0 8px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand svg{width:56px;height:56px;flex:none}
h1{margin:0;font-size:1.9rem;letter-spacing:.08em;line-height:1.1}
.sub{margin:2px 0 0;color:var(--mut)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.langs{display:flex;gap:6px;flex-wrap:wrap}
button,.btn{font:inherit;cursor:pointer;border:2px solid var(--acc);background:var(--card);color:var(--ink);border-radius:12px;padding:6px 12px;min-height:40px}
button:hover{background:var(--chip)}
button.on{background:var(--acc);color:#fff}
button.primary{background:var(--acc);color:#fff}
button.sm{padding:2px 10px;min-height:34px;min-width:34px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin-bottom:6px}
.tabs button{white-space:nowrap}
.view[hidden]{display:none}
.lead{font-size:1.05rem}
.panel{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.panel h2{margin:0 0 8px;font-size:1.2rem}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label{display:block;font-size:.9rem;color:var(--mut)}
input[type=number],input[type=text],textarea{font:inherit;width:100%;padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--chip);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.7rem;line-height:1.2;color:var(--acc)}
.stat span{font-size:.85rem;color:var(--mut)}
ul.plain{margin:0;padding-left:20px}
ul.plain li{margin:6px 0}

.chkrow{display:flex;gap:10px;align-items:flex-start;color:inherit;font-size:1rem}

.tl{list-style:none;padding:0;margin:0}

.msg{background:var(--bg);border:2px dashed var(--line);border-radius:12px;padding:10px;margin:8px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:10px;display:grid;grid-template-columns:120px 1fr;gap:10px;break-inside:avoid}
.card svg{width:100%;height:auto;display:block}
.card h4{margin:0 0 4px;font-size:1.1rem}
.card .cr{font-size:.84rem;margin:2px 0}

.card .no{float:right;font-size:.75rem;color:var(--mut)}
.card .by{margin-top:8px;font-size:.8rem;color:var(--mut);border-top:1px solid var(--mut);padding-top:2px}
.mf{transition:none}
.hero{text-align:center;padding:6px 0 0}
.hero h2{font-size:1.9rem;margin:6px 0 4px;letter-spacing:.04em}

.marq{overflow:hidden;padding:4px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}

.marq.rev .mtrack{animation-direction:reverse}
.marq:hover .mtrack,.marq:focus-within .mtrack{animation-play-state:paused}

@keyframes bob{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-9px) rotate(3deg)}}

.card.hl{outline:4px solid var(--acc);outline-offset:2px}
.ed{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px 12px;margin-bottom:10px}

.sadapt{flex:1 1 100%;margin:2px 0 0;text-align:center;font-size:.85rem;color:var(--mut)}
.vshare:focus{outline:none}

src5:["Blocul și vecinii: lasă o cutie de colectare la scară cu mesajul de mai jos; rulourile de carton, ouăle și cutiile de cereale se adună repede", "Your building and neighbours: leave a collection box at the entrance with the message below; cardboard tubes, egg cartons and cereal boxes pile up fast", "Votre immeuble et vos voisins : laissez une caisse de collecte à l'entrée avec le message ci-dessous ; rouleaux en carton, boîtes à œufs et boîtes de céréales s'accumulent vite", "Il tuo palazzo e i vicini: lascia una scatola di raccolta all'ingresso con il messaggio qui sotto; rotoli di cartone, cartoni delle uova e scatole di cereali si accumulano in fretta", "Tu edificio y tus vecinos: deja una caja de recogida en la entrada con el mensaje de abajo; los tubos de cartón, cartones de huevos y cajas de cereales se acumulan rápido", "O prédio e os vizinhos: deixe uma caixa de recolha à entrada com a mensagem abaixo; rolos de cartão, cartões de ovos e caixas de cereais juntam-se depressa", "Wohnhaus und Nachbarn: Sammelkiste mit der Nachricht unten am Eingang aufstellen; Pappröhren, Eierkartons und Müslischachteln sammeln sich schnell an", "A lakóház és a szomszédok: tegyél ki egy gyűjtődobozt a bejárathoz az alábbi üzenettel; a kartonhengerek, tojástartók és müzlisdobozok gyorsan összegyűlnek"],

h_msg:["Mesaj de colectare","Collection message","Message de collecte","Messaggio di raccolta","Mensaje de recogida","Mensagem de recolha","Sammelnachricht","Gyűjtési üzenet"],
msg:["Pregătim la Halo Fest un atelier de monștri din materiale reciclabile și avem nevoie de ajutor! Ne ajută: rulouri de carton, cutii mici, sticle PET de 0,5 l curate, capace, cartoane de ouă, ziare, nasturi, lână și resturi de stofă. Mulțumim că le dați o a doua viață!","We're preparing a recycled-materials monster workshop at Halo Fest and need your help! We can use: cardboard tubes, small boxes, clean 0.5 L PET bottles, bottle caps, egg cartons, newspapers, buttons, wool and fabric scraps. Thank you for giving things a second life!","Nous préparons à Halo Fest un atelier de monstres en matériaux recyclés et nous avons besoin de vous ! Nous cherchons : rouleaux en carton, petites boîtes, bouteilles PET de 0,5 L propres, bouchons, boîtes à œufs, journaux, boutons, laine et chutes de tissu. Merci de donner une seconde vie aux objets !","Stiamo preparando all'Halo Fest un laboratorio di mostri con materiali riciclati e abbiamo bisogno del vostro aiuto! Ci servono: rotoli di cartone, scatoline, bottiglie PET da 0,5 L pulite, tappi, cartoni delle uova, giornali, bottoni, lana e ritagli di stoffa. Grazie per dare una seconda vita alle cose!","¡Preparamos en Halo Fest un taller de monstruos con materiales reciclados y necesitamos vuestra ayuda! Nos sirven: tubos de cartón, cajitas, botellas PET de 0,5 L limpias, tapones, cartones de huevos, periódicos, botones, lana y retales. ¡Gracias por dar una segunda vida a las cosas!","Estamos a preparar na Halo Fest uma oficina de monstros com materiais reciclados e precisamos da vossa ajuda! Servem-nos: rolos de cartão, caixas pequenas, garrafas PET de 0,5 L limpas, tampas, cartões de ovos, jornais, botões, lã e retalhos. Obrigado por darem uma segunda vida às coisas!","Wir bereiten beim Halo Fest eine Monster-Werkstatt aus Recyclingmaterial vor und brauchen Ihre Hilfe! Gesucht werden: Pappröhren, kleine Schachteln, saubere PET-Flaschen (0,5 L), Flaschendeckel, Eierkartons, Zeitungen, Knöpfe, Wolle und Stoffreste. Danke, dass Sie Dingen ein zweites Leben schenken!","A Halo Festen újrahasznosított anyagokból szörnyműhelyt szervezünk, és szükségünk van a segítségetekre! Jöhet: kartonhenger, kis doboz, tiszta 0,5 literes PET-palack, kupak, tojástartó, újság, gomb, gyapjú és textilmaradék. Köszönjük, hogy új életet adtok a tárgyaknak!"],

phd_w:["Povestim scurt de unde vin materialele: lucruri care primesc o a doua viață. Reguli: foarfecele se folosesc doar așezat, pistolul de lipit e doar al adulților.","A short story of where the materials come from: things getting a second life. Rules: scissors are used only when seated, the glue gun is for adults only.","Court récit d'où viennent les matériaux : des objets qui reçoivent une seconde vie. Règles : ciseaux uniquement assis, pistolet à colle réservé aux adultes.","Breve racconto di dove vengono i materiali: cose che ricevono una seconda vita. Regole: le forbici si usano solo seduti, la colla a caldo è solo per gli adulti.","Breve relato de dónde vienen los materiales: cosas que reciben una segunda vida. Reglas: las tijeras solo se usan sentado, la pistola de silicona es solo para adultos.","Breve história de onde vêm os materiais: coisas que ganham uma segunda vida. Regras: as tesouras só se usam sentado, a pistola de cola quente é só para adultos.","Kurze Geschichte, woher das Material kommt: Dinge bekommen ein zweites Leben. Regeln: Scheren nur im Sitzen, die Heißklebepistole nur für Erwachsene.","Rövid mese arról, honnan jönnek az anyagok: a tárgyak új életet kapnak. Szabályok: ollót csak ülve használunk, a ragasztópisztoly csak felnőtteknek való."],
ph_c:["Fiecare copil primește un cartonaș cu un plan unic sau alege un monstru din Bestiar, pe care îl poate schimba cum vrea. Apoi își alege materialul de bază.","Pick your monster","Choisis ton monstre","Scegli il tuo mostro","Elige tu monstruo","Escolhe o teu monstro","Such dir dein Monster aus","Válaszd ki a szörnyed"],
phd_c:["Fiecare copil primește un cartonaș cu un plan unic sau alege un monstru din Bestiar, și îl poate schimba cum vrea. Își alege materialul de bază.", "Each child gets a card with a unique blueprint or picks a monster from the Bestiary, and may change it freely. They choose the base material.", "Chaque enfant reçoit une carte avec un plan unique ou choisit un monstre du Bestiaire, et peut le modifier librement. Il choisit le matériau de base.", "Ogni bambino riceve una scheda con un progetto unico o sceglie un mostro dal Bestiario, e può cambiarlo liberamente. Sceglie il materiale di base.", "Cada niño recibe una tarjeta con un plano único o elige un monstruo del Bestiario, y puede cambiarlo libremente. Elige el material base.", "Cada criança recebe um cartão com um projeto único ou escolhe um monstro do Bestiário, e pode alterá-lo à vontade. Escolhe o material de base.", "Jedes Kind bekommt eine Karte mit einem einzigartigen Plan oder wählt ein Monster aus dem Bestiarium und darf es frei ändern. Es wählt das Grundmaterial.", "Minden gyerek kap egy kártyát egyedi tervvel, vagy választ egy szörnyet a Bestiáriumból, és szabadon megváltoztathatja. Kiválasztja az alapanyagot."],
ph_b:["Construim","Build","Construction","Costruiamo","Construimos","Construímos","Bauen","Építés"],
phd_b:["Corpul se leagă cu bandă și lipici; membrele și ochii se adaugă pe rând. Adulții pregătesc ce e greu de tăiat.","Bodies are joined with tape and glue; limbs and eyes are added one by one. Adults pre-cut anything hard to cut.","Le corps se fixe avec du ruban et de la colle ; membres et yeux s'ajoutent un par un. Les adultes prédécoupent ce qui est difficile.","Il corpo si fissa con nastro e colla; arti e occhi si aggiungono uno alla volta. Gli adulti tagliano prima ciò che è difficile.","El cuerpo se une con cinta y cola; las extremidades y los ojos se añaden uno a uno. Los adultos precortan lo difícil.","O corpo junta-se com fita e cola; membros e olhos juntam-se um a um. Os adultos pré-cortam o que é difícil.","Der Körper wird mit Klebeband und Leim verbunden; Gliedmaßen und Augen kommen nacheinander dazu. Erwachsene schneiden Schwieriges vor.","A testet ragasztószalaggal és ragasztóval rögzítik; a végtagok és szemek sorban kerülnek rá. A nehezen vágható részeket a felnőttek előre kivágják."],
ph_p:["Culori și detalii","Colour and details","Couleurs et détails","Colori e dettagli","Color y detalles","Cor e detalhes","Farbe und Details","Színek és részletek"],
phd_p:["Vopsea pe mese acoperite cu ziare; monștrii uzi se pun la uscat într-o zonă separată. Cine termină repede adaugă păr, țepi sau aripi.","Paint goes on tables covered with newspaper; wet monsters rest in a separate drying area. Fast finishers add hair, spikes or wings.","La peinture se fait sur des tables couvertes de journaux ; les monstres mouillés sèchent à part. Les plus rapides ajoutent cheveux, piques ou ailes.","La pittura si fa su tavoli coperti di giornali; i mostri bagnati asciugano in un'area separata. Chi finisce presto aggiunge capelli, spine o ali.","La pintura se hace sobre mesas cubiertas con periódicos; los monstruos mojados se secan aparte. Quien termina antes añade pelo, púas o alas.","A pintura faz-se em mesas cobertas com jornais; os monstros molhados secam à parte. Quem acaba mais cedo junta cabelo, espinhos ou asas.","Gemalt wird auf mit Zeitungen abgedeckten Tischen; nasse Monster trocknen separat. Wer früher fertig ist, ergänzt Haare, Stacheln oder Flügel.","Festés újsággal letakart asztalon; a vizes szörnyek külön helyen száradnak. Aki hamar végez, hajat, tüskét vagy szárnyat tesz rá."],
ph_s:["Numele și povestea","Name and story","Nom et histoire","Nome e storia","Nombre e historia","Nome e história","Name und Geschichte","Név és történet"],
phd_s:["Fiecare copil își botează monstrul și îi spune o poveste de o propoziție partenerului de masă.","Each child names their monster and tells a one-sentence story to a table partner.","Chaque enfant baptise son monstre et raconte une histoire en une phrase à son voisin.","Ogni bambino dà un nome al suo mostro e racconta una storia di una frase al compagno di tavolo.","Cada niño bautiza a su monstruo y cuenta una historia de una frase a su compañero de mesa.","Cada criança dá um nome ao seu monstro e conta uma história de uma frase ao colega de mesa.","Jedes Kind tauft sein Monster und erzählt dem Tischnachbarn eine Geschichte in einem Satz.","Minden gyerek elnevezi a szörnyét, és egy mondatos történetet mesél az asztaltársának."],
ph_f:["Parada monștrilor","Monster parade","Défilé des monstres","Parata dei mostri","Desfile de monstruos","Desfile dos monstros","Monsterparade","Szörnyfelvonulás"],
phd_f:["Toți monștrii defilează, primesc aplauze și diplomă. La final, resturile se sortează pe materiale.","All monsters parade, get applause and a diploma. At the end, scraps are sorted by material.","Tous les monstres défilent, reçoivent des applaudissements et un diplôme. À la fin, les chutes sont triées par matériau.","Tutti i mostri sfilano, ricevono applausi e un diploma. Alla fine gli scarti si separano per materiale.","Todos los monstruos desfilan, reciben aplausos y un diploma. Al final se clasifican los restos por material.","Todos os monstros desfilam, recebem aplausos e um diploma. No fim, separam-se os restos por material.","Alle Monster laufen vorbei, bekommen Applaus und eine Urkunde. Am Ende werden die Reste nach Material getrennt.","Minden szörny felvonul, tapsot és oklevelet kap. A végén a maradékokat anyag szerint szétválogatják."],

h_safety:["Siguranță și pregătire","Safety and preparation","Sécurité et préparation","Sicurezza e preparazione","Seguridad y preparación","Segurança e preparação","Sicherheit und Vorbereitung","Biztonság és előkészítés"],
s1:["Sticle și cutii: doar curate și uscate; fără conserve, sticlă, spray-uri sau ambalaje de medicamente ori substanțe chimice.","Bottles and boxes: only clean and dry; no tin cans, glass, aerosols or medicine/chemical packaging.","Bouteilles et boîtes : propres et sèches uniquement ; ni conserves, ni verre, ni aérosols, ni emballages de médicaments ou de produits chimiques.","Bottiglie e scatole: solo pulite e asciutte; niente lattine, vetro, bombolette o confezioni di medicinali o prodotti chimici.","Botellas y cajas: solo limpias y secas; sin latas, vidrio, aerosoles ni envases de medicamentos o productos químicos.","Garrafas e caixas: só limpas e secas; sem latas, vidro, aerossóis nem embalagens de medicamentos ou químicos.","Flaschen und Schachteln: nur sauber und trocken; keine Dosen, kein Glas, keine Sprays, keine Medikamenten- oder Chemikalienverpackungen.","Palackok és dobozok: csak tiszták és szárazak; ne legyen konzervdoboz, üveg, spray, gyógyszer- vagy vegyszerescsomagolás."],
s2:["Capacele și nasturii mici nu se dau copiilor sub 3 ani; la grupe cu vârste mixte, adulții supraveghează.","Small caps and buttons are not for children under 3; supervise mixed-age groups.","Les petits bouchons et boutons ne conviennent pas aux moins de 3 ans ; supervisez les groupes d'âges mixtes.","Tappi e bottoni piccoli non sono adatti ai bambini sotto i 3 anni; supervisionare i gruppi misti.","Los tapones y botones pequeños no son para menores de 3 años; supervisa los grupos de edades mixtas.","Tampas e botões pequenos não são para menores de 3 anos; supervisione os grupos de idades mistas.","Kleine Deckel und Knöpfe sind nichts für Kinder unter 3 Jahren; gemischte Altersgruppen beaufsichtigen.","Az apró kupakok és gombok 3 év alatt nem adhatók; vegyes korú csoportnál felügyelet kell."],
s3:["Pistolul de lipit la cald și cutterul rămân la adulți, la o masă separată.","The hot-glue gun and cutter stay with adults, at a separate table.","Le pistolet à colle et le cutter restent aux adultes, à une table séparée.","Pistola per colla a caldo e cutter restano agli adulti, a un tavolo separato.","La pistola de silicona y el cúter quedan en manos de adultos, en una mesa aparte.","A pistola de cola quente e o x-ato ficam com os adultos, numa mesa separada.","Heißklebepistole und Cutter bleiben bei den Erwachsenen an einem eigenen Tisch.","A ragasztópisztoly és a vágókés a felnőtteknél marad, külön asztalnál."],
s4:["Pregătire: spală și usucă toate ambalajele cu o zi înainte; taie dinainte marginile ascuțite.","Prep: wash and dry all packaging the day before; trim sharp edges beforehand.","Préparation : lavez et séchez les emballages la veille ; coupez les bords tranchants à l'avance.","Preparazione: lavare e asciugare gli imballaggi il giorno prima; eliminare in anticipo i bordi taglienti.","Preparación: lava y seca los envases el día anterior; recorta antes los bordes cortantes.","Preparação: lave e seque as embalagens na véspera; apare antes as arestas cortantes.","Vorbereitung: Verpackungen am Vortag waschen und trocknen; scharfe Kanten vorher entfernen.","Előkészítés: az előző napon mosd ki és szárítsd meg a csomagolásokat; az éles széleket előre vágd le."],
s5:["Vopsea lavabilă; copiii poartă tricouri vechi sau șorțuri; sala bine aerisită.","Washable paint; children wear old T-shirts or aprons; ventilate the room.","Peinture lavable ; les enfants portent un vieux T-shirt ou un tablier ; aérez la salle.","Colori lavabili; i bambini indossano vecchie magliette o grembiuli; arieggiare la sala.","Pintura lavable; los niños llevan camisetas viejas o delantales; ventila la sala.","Tinta lavável; as crianças usam t-shirts velhas ou aventais; arejem a sala.","Abwaschbare Farbe; Kinder tragen alte T-Shirts oder Schürzen; Raum lüften.","Lemosható festék; a gyerekek régi pólót vagy kötényt viselnek; szellőztess."],
s6:["Stabiliți un punct de predare și preluare a copiilor și un colț de prim ajutor.","Set a drop-off and pick-up point for the children and a first-aid corner.","Prévoyez un point de dépose et de récupération des enfants et un coin premiers secours.","Stabilire un punto di consegna e ritiro dei bambini e un angolo di primo soccorso.","Define un punto de entrega y recogida de los niños y un rincón de primeros auxilios.","Defina um ponto de entrega e recolha das crianças e um canto de primeiros socorros.","Übergabe- und Abholpunkt für die Kinder sowie eine Erste-Hilfe-Ecke festlegen.","Jelölj ki átadási és átvételi pontot a gyerekeknek, valamint egy elsősegély-sarkot."],

alb_help:["Câte o fișă tipăribilă pentru fiecare participant, cu monstrul lui: nume, materiale și sunet. Numele sunt cele din fila Diplome; fără nume, fișele rămân cu linie goală. Monștrii sunt cei din fila Monștri (același număr de copii și același „seed”).","One printable sheet per participant with their monster: name, materials and sound. Names come from the Diplomas tab; without names the sheets keep a blank line. The monsters are those of the Monsters tab (same number of children and same seed).","Une fiche imprimable par participant avec son monstre : nom, matériaux et son. Les prénoms viennent de l'onglet Diplômes ; sans prénoms, une ligne reste vide. Les monstres sont ceux de l'onglet Monstres (même nombre d'enfants et même graine).","Una scheda stampabile per ogni partecipante con il suo mostro: nome, materiali e suono. I nomi vengono dalla scheda Diplomi; senza nomi resta una riga vuota. I mostri sono quelli della scheda Mostri (stesso numero di bambini e stesso seed).","Una ficha imprimible por participante con su monstruo: nombre, materiales y sonido. Los nombres vienen de la pestaña Diplomas; sin nombres queda una línea en blanco. Los monstruos son los de la pestaña Monstruos (mismo número de niños y misma semilla).","Uma ficha imprimível por participante com o seu monstro: nome, materiais e som. Os nomes vêm do separador Diplomas; sem nomes fica uma linha em branco. Os monstros são os do separador Monstros (mesmo número de crianças e mesma semente).","Pro Teilnehmer ein druckbares Blatt mit seinem Monster: Name, Materialien und Klang. Die Namen kommen aus dem Reiter Urkunden; ohne Namen bleibt eine leere Linie. Die Monster sind die des Reiters Monster (gleiche Kinderzahl, gleicher Seed).","Résztvevőnként egy nyomtatható lap a szörnyével: név, anyagok és hang. A nevek az Oklevelek lapról jönnek; név nélkül üres vonal marad. A szörnyek a Szörnyek lapról valók (azonos gyereklétszám és seed)."],

alb_parade:["📽️ Exportă Parada pentru FASCICUL","📽️ Export the Parade for FASCICUL","📽️ Exporter la Parade pour FASCICUL","📽️ Esporta la Parata per FASCICUL","📽️ Exportar el Desfile para FASCICUL","📽️ Exportar o Desfile para o FASCICUL","📽️ Parade für FASCICUL exportieren","📽️ Felvonulás exportálása a FASCICUL-hoz"],
alb_pnote:["Parada se deschide în aplicația FASCICUL (Ecran → 📂 Sesiune) și se proiectează. Câte 40 de monștri pe tablă; dacă sunt mai mulți, se descarcă mai multe fișiere, de deschis pe rând.","The Parade opens in the FASCICUL app (Screen → 📂 Session) and is projected. 40 monsters per board; with more, several files are downloaded, to open one after another.","La Parade s'ouvre dans l'application FASCICUL (Écran → 📂 Session) et se projette. 40 monstres par tableau ; au-delà, plusieurs fichiers sont téléchargés, à ouvrir l'un après l'autre.","La Parata si apre nell'app FASCICUL (Schermo → 📂 Sessione) e si proietta. 40 mostri per lavagna; se sono di più si scaricano più file, da aprire uno dopo l'altro.","El Desfile se abre en la app FASCICUL (Pantalla → 📂 Sesión) y se proyecta. 40 monstruos por pizarra; si hay más se descargan varios archivos, para abrir uno tras otro.","O Desfile abre-se na app FASCICUL (Ecrã → 📂 Sessão) e é projetado. 40 monstros por quadro; se forem mais, descarregam-se vários ficheiros, a abrir um a um.","Die Parade wird in der App FASCICUL geöffnet (Bildschirm → 📂 Sitzung) und projiziert. 40 Monster pro Tafel; bei mehr werden mehrere Dateien geladen, nacheinander zu öffnen.","A Felvonulás a FASCICUL alkalmazásban nyílik meg (Képernyő → 📂 Munkamenet), és kivetíthető. Táblánként 40 szörny; ha több van, több fájl töltődik le, egymás után megnyitva."],

intro2:["Pentru un singur organizator: materialele se strâng în 4 zile din împrejurimi, iar atelierul se desfășoară la o singură masă, pe serii.", "Built for a single organizer: materials are collected in 4 days from the neighbourhood, and the workshop runs at a single table, in sessions.", "Pensé pour un seul organisateur : les matériaux se collectent en 4 jours dans le quartier, et l'atelier se déroule à une seule table, par séries.", "Pensata per un solo organizzatore: i materiali si raccolgono in 4 giorni nel quartiere e il laboratorio si svolge a un solo tavolo, a turni.", "Pensada para un solo organizador: los materiales se recogen en 4 días por el barrio y el taller se desarrolla en una sola mesa, por turnos.", "Pensada para um único organizador: os materiais recolhem-se em 4 dias no bairro e a oficina decorre numa só mesa, por turnos.", "Gedacht für eine einzelne organisierende Person: Das Material wird in 4 Tagen in der Umgebung gesammelt, und der Workshop läuft an einem einzigen Tisch in Durchgängen.", "Egyetlen szervezőre szabva: az anyagokat 4 nap alatt gyűjtheted össze a környéken, a műhely pedig egyetlen asztalnál, turnusokban zajlik."],

tp1:["Monștrii se fac mici, cât palma (max. 20 cm): încap pe masă, se usucă repede și se duc ușor acasă.", "Keep monsters small, palm-sized (max. 20 cm): they fit on the table, dry fast and are easy to carry home.", "Monstres petits, de la taille d'une paume (max. 20 cm) : ils tiennent sur la table, sèchent vite et se transportent facilement.", "Mostri piccoli, grandi come un palmo (max. 20 cm): stanno sul tavolo, si asciugano in fretta e si portano facilmente a casa.", "Monstruos pequeños, del tamaño de la palma (máx. 20 cm): caben en la mesa, se secan rápido y se llevan fácil a casa.", "Monstros pequenos, do tamanho da palma da mão (máx. 20 cm): cabem na mesa, secam depressa e levam-se facilmente para casa.", "Monster klein halten, handtellergroß (max. 20 cm): sie passen auf den Tisch, trocknen schnell und lassen sich leicht heimtragen.", "A szörnyek kicsik legyenek, tenyérnyiek (max. 20 cm): elférnek az asztalon, gyorsan száradnak, és könnyen hazavihetők."],
tp2:["Lucrați pe serii: următoarea serie așteaptă afară și își colorează cartonașul de monstru (dă-le un creion), deci nu se pierde timp.", "Work in sessions: the next group waits outside and colours its monster card (give them a pencil), so no time is lost.", "Travaillez par séries : le groupe suivant attend dehors et colorie sa carte de monstre (donnez-lui un crayon), sans perdre de temps.", "Lavorate a turni: il gruppo successivo aspetta fuori e colora la propria scheda del mostro (dagli una matita), così non si perde tempo.", "Trabajad por turnos: el grupo siguiente espera fuera y colorea su tarjeta de monstruo (dale un lápiz), así no se pierde tiempo.", "Trabalhem por turnos: o grupo seguinte espera fora e colore o seu cartão de monstro (dê-lhe um lápis), assim não se perde tempo.", "In Durchgängen arbeiten: Die nächste Gruppe wartet draußen und malt ihre Monsterkarte aus (Stift bereitlegen), so geht keine Zeit verloren.", "Turnusokban dolgozzatok: a következő csoport kint vár, és kiszínezi a szörnykártyáját (adj neki ceruzát), így nem megy kárba idő."],
tp3:["Un singur kit complet pe masă, completat între serii; copiii nu se plimbă după materiale, iar adulții aduc din depozit ce lipsește.", "A single full kit on the table, topped up between sessions; children don't walk around for materials, adults bring what's missing from the depot.", "Un seul kit complet sur la table, réapprovisionné entre les séries ; les enfants ne circulent pas pour chercher du matériel, les adultes apportent ce qui manque depuis le dépôt.", "Un solo kit completo sul tavolo, rifornito tra un turno e l'altro; i bambini non girano per i materiali, gli adulti portano dal deposito ciò che manca.", "Un solo kit completo en la mesa, repuesto entre turnos; los niños no se desplazan a buscar material, los adultos traen del depósito lo que falte.", "Um único kit completo na mesa, reposto entre turnos; as crianças não andam à procura de material, os adultos trazem do depósito o que falta.", "Ein einziges komplettes Set auf dem Tisch, zwischen den Durchgängen aufgefüllt; Kinder laufen nicht nach Material herum, Erwachsene holen Fehlendes aus dem Lager.", "Egyetlen teljes készlet az asztalon, a turnusok között feltöltve; a gyerekek nem járkálnak anyagért, a hiányzót a felnőttek hozzák a raktárból."],
tp4:["Vopsea doar dacă ai loc de uscare; altfel folosește carioci, hârtie colorată și colaj.", "Use paint only if you have drying space; otherwise use markers, coloured paper and collage.", "Peinture seulement si vous avez de la place pour sécher ; sinon feutres, papier de couleur et collage.", "Pittura solo se hai spazio per asciugare; altrimenti pennarelli, carta colorata e collage.", "Pintura solo si tienes espacio para secar; si no, rotuladores, papel de color y collage.", "Tinta só se tiver espaço para secar; caso contrário, marcadores, papel colorido e colagem.", "Farbe nur, wenn Platz zum Trocknen da ist; sonst Filzstifte, Buntpapier und Collage.", "Festéket csak akkor használj, ha van hely a száradásra; különben filctollat, színes papírt és kollázst."],
tp5:["Parada se face pe loc: fiecare masă își prezintă monștrii, fără defilare prin sală.", "The parade happens in place: each table presents its monsters, no walking through the room.", "Le défilé se fait sur place : chaque table présente ses monstres, sans circuler dans la salle.", "La parata si fa sul posto: ogni tavolo presenta i suoi mostri, senza sfilare per la sala.", "El desfile se hace en el sitio: cada mesa presenta sus monstruos, sin recorrer la sala.", "O desfile faz-se no lugar: cada mesa apresenta os seus monstros, sem percorrer a sala.", "Die Parade findet vor Ort statt: Jeder Tisch stellt seine Monster vor, ohne Gang durch den Raum.", "A felvonulás a helyszínen zajlik: minden asztal bemutatja a szörnyeit, nem kell végigvonulni a termen."],

d1:["Ziua 1 · Organizare și carton: dimineața, supermarketuri și magazine din cartier, la descărcarea mărfii: carton ondulat (≈{corr}), cutii mici (≈{box}), cartoane de ouă (≈{egg}). Trimite mesajul de colectare cu termen de predare în seara zilei 3 și lasă o cutie de colectare la scara blocului.", "Day 1 · Set-up and cardboard: in the morning, neighbourhood supermarkets and shops when goods are unloaded: corrugated cardboard (≈{corr}), small boxes (≈{box}), egg cartons (≈{egg}). Send the collection message with a drop-off deadline of the evening of day 3 and leave a collection box at your building's entrance.", "Jour 1 · Organisation et carton : le matin, supermarchés et magasins du quartier à la livraison : carton ondulé (≈{corr}), petites boîtes (≈{box}), boîtes à œufs (≈{egg}). Envoyez le message de collecte avec une date limite le soir du jour 3 et déposez une caisse de collecte à l'entrée de l'immeuble.", "Giorno 1 · Organizzazione e cartone: al mattino, supermercati e negozi del quartiere durante lo scarico merci: cartone ondulato (≈{corr}), scatoline (≈{box}), cartoni delle uova (≈{egg}). Invia il messaggio di raccolta con scadenza la sera del giorno 3 e lascia una scatola di raccolta all'ingresso del palazzo.", "Día 1 · Organización y cartón: por la mañana, supermercados y tiendas del barrio durante la descarga: cartón ondulado (≈{corr}), cajitas (≈{box}), cartones de huevos (≈{egg}). Envía el mensaje de recogida con plazo la tarde del día 3 y deja una caja de recogida en la entrada del edificio.", "Dia 1 · Organização e cartão: de manhã, supermercados e lojas do bairro na descarga da mercadoria: cartão canelado (≈{corr}), caixas pequenas (≈{box}), cartões de ovos (≈{egg}). Envie a mensagem de recolha com prazo até à noite do dia 3 e deixe uma caixa de recolha à entrada do prédio.", "Tag 1 · Organisation und Pappe: morgens Supermärkte und Geschäfte im Viertel beim Warenanliefern: Wellpappe (≈{corr}), kleine Schachteln (≈{box}), Eierkartons (≈{egg}). Sammelnachricht mit Abgabefrist am Abend von Tag 3 verschicken und eine Sammelkiste am Hauseingang aufstellen.", "1. nap · Szervezés és karton: reggel a környékbeli szupermarketek és boltok az áru lepakolásakor: hullámkarton (≈{corr}), kis dobozok (≈{box}), tojástartók (≈{egg}). Küldd el a gyűjtési üzenetet a 3. nap estéjéig tartó határidővel, és tegyél ki egy gyűjtődobozt a lépcsőházba."],
d2:["Ziua 2 · Plastic și hârtie: cafenele, restaurante, baruri pentru sticle PET (≈{pet}) și capace (≈{caps}), apoi tipografie, papetărie sau bibliotecă pentru ziare și reviste (≈{news} foi). Seara spală PET-urile și capacele și lasă-le la uscat peste noapte.", "Day 2 · Plastic and paper: cafés, restaurants and bars for PET bottles (≈{pet}) and caps (≈{caps}), then a print shop, stationer or library for newspapers and magazines (≈{news} sheets). In the evening wash the bottles and caps and leave them to dry overnight.", "Jour 2 · Plastique et papier : cafés, restaurants et bars pour les bouteilles PET (≈{pet}) et les bouchons (≈{caps}), puis imprimerie, papeterie ou bibliothèque pour journaux et magazines (≈{news} feuilles). Le soir, lavez bouteilles et bouchons et laissez-les sécher pendant la nuit.", "Giorno 2 · Plastica e carta: bar, ristoranti e locali per bottiglie PET (≈{pet}) e tappi (≈{caps}), poi tipografia, cartoleria o biblioteca per giornali e riviste (≈{news} fogli). La sera lava bottiglie e tappi e lasciali asciugare per tutta la notte.", "Día 2 · Plástico y papel: cafeterías, restaurantes y bares para botellas PET (≈{pet}) y tapones (≈{caps}), luego imprenta, papelería o biblioteca para periódicos y revistas (≈{news} hojas). Por la noche lava las botellas y los tapones y déjalos secar toda la noche.", "Dia 2 · Plástico e papel: cafés, restaurantes e bares para garrafas PET (≈{pet}) e tampas (≈{caps}), depois tipografia, papelaria ou biblioteca para jornais e revistas (≈{news} folhas). À noite, lave as garrafas e as tampas e deixe-as secar durante a noite.", "Tag 2 · Plastik und Papier: Cafés, Restaurants und Bars für PET-Flaschen (≈{pet}) und Deckel (≈{caps}), dann Druckerei, Schreibwarenladen oder Bibliothek für Zeitungen und Zeitschriften (≈{news} Blatt). Abends Flaschen und Deckel waschen und über Nacht trocknen lassen.", "2. nap · Műanyag és papír: kávézók, éttermek és bárok a PET-palackokért (≈{pet}) és kupakokért (≈{caps}), majd nyomda, papírbolt vagy könyvtár az újságokért és magazinokért (≈{news} lap). Este mosd ki a palackokat és a kupakokat, és hagyd őket egy éjszakára száradni."],
d3:["Ziua 3 · Textile, vecini și cumpărături: croitorie sau mercerie pentru stofă, nasturi și lână; ridică ce au strâns vecinii (rulouri de carton ≈{tube}); completează lipsurile cu înlocuitori și cumpără consumabilele (lipici, bandă, tempera) dintr-o singură oprire.", "Day 3 · Textiles, neighbours and shopping: a tailor or haberdasher for fabric, buttons and wool; pick up what the neighbours have saved (cardboard tubes ≈{tube}); fill gaps with substitutes and buy the supplies (glue, tape, paint) in a single stop.", "Jour 3 · Textiles, voisins et achats : couturier ou mercerie pour tissu, boutons et laine ; récupérez ce que les voisins ont gardé (rouleaux en carton ≈{tube}) ; comblez les manques avec des substituts et achetez les fournitures (colle, ruban, gouache) en un seul passage.", "Giorno 3 · Tessuti, vicini e acquisti: sarto o merceria per stoffa, bottoni e lana; ritira ciò che i vicini hanno messo da parte (rotoli di cartone ≈{tube}); riempi le mancanze con sostituti e compra i materiali (colla, nastro, tempera) in un'unica tappa.", "Día 3 · Telas, vecinos y compras: sastrería o mercería para tela, botones y lana; recoge lo que han guardado los vecinos (tubos de cartón ≈{tube}); cubre lo que falte con sustitutos y compra los suministros (cola, cinta, témpera) en una sola parada.", "Dia 3 · Tecidos, vizinhos e compras: alfaiate ou retrosaria para tecido, botões e lã; recolha o que os vizinhos guardaram (rolos de cartão ≈{tube}); preencha as faltas com substitutos e compre os consumíveis (cola, fita, guache) numa única paragem.", "Tag 3 · Stoffe, Nachbarn und Einkauf: Schneiderei oder Kurzwarenladen für Stoff, Knöpfe und Wolle; abholen, was die Nachbarn aufgehoben haben (Pappröhren ≈{tube}); Lücken mit Ersatz füllen und die Grundmaterialien (Leim, Klebeband, Farbe) in einem Rutsch kaufen.", "3. nap · Textil, szomszédok és vásárlás: szabó vagy rövidáru-bolt a textilért, gombokért és gyapjúért; szedd össze, amit a szomszédok félretettek (kartonhengerek ≈{tube}); pótold a hiányt helyettesítőkkel, és vedd meg a kellékeket (ragasztó, szalag, tempera) egy megállóban."],
d4:["Ziua 4 · Pregătire: sortează tot pe categorii în cutii; taie marginile ascuțite și pre-taie cartoanele mari; tipărește cartonașele și diplomele; numără și încarcă mașina.", "Day 4 · Preparation: sort everything into boxes by category; trim sharp edges and pre-cut big cardboard; print the cards and diplomas; count and load the car.", "Jour 4 · Préparation : triez tout en caisses par catégorie ; coupez les bords tranchants et prédécoupez les grands cartons ; imprimez cartes et diplômes ; comptez et chargez la voiture.", "Giorno 4 · Preparazione: ordina tutto in scatole per categoria; elimina i bordi taglienti e pretaglia i cartoni grandi; stampa schede e diplomi; conta e carica l'auto.", "Día 4 · Preparación: clasifica todo en cajas por categoría; recorta los bordes cortantes y precorta los cartones grandes; imprime tarjetas y diplomas; cuenta y carga el coche.", "Dia 4 · Preparação: separe tudo em caixas por categoria; apare as arestas cortantes e pré-corte os cartões grandes; imprima cartões e diplomas; conte e carregue o carro.", "Tag 4 · Vorbereitung: alles nach Kategorie in Kisten sortieren; scharfe Kanten entfernen und große Kartons vorschneiden; Karten und Urkunden drucken; zählen und das Auto beladen.", "4. nap · Előkészítés: rendezd mindent kategóriák szerint dobozokba; vágd le az éles széleket, és vágd elő a nagy kartonokat; nyomtasd ki a kártyákat és okleveleket; számolj, és pakold be az autót."],

s7:["Sunet: volum moderat (ca într-o conversație, fără boxe puternice); alege nivelul «fioros» după cel mai mic copil din serie și păstrează un colț liniștit pentru copiii sensibili la zgomot.", "Sound: keep the volume moderate (conversation level, no loud speakers); pick the 'fierceness' level for the youngest child in the group and keep a quiet corner for noise-sensitive children.", "Son : volume modéré (niveau d'une conversation, pas de haut-parleurs puissants) ; choisissez le niveau de férocité pour le plus jeune du groupe et prévoyez un coin calme pour les enfants sensibles au bruit.", "Suono: volume moderato (come una conversazione, niente casse potenti); scegliete il livello di ferocia in base al più piccolo del gruppo e tenete un angolo tranquillo per i bambini sensibili ai rumori.", "Sonido: volumen moderado (como en una conversación, sin altavoces potentes); elijan el nivel de ferocidad según el más pequeño del grupo y reserven un rincón tranquilo para los niños sensibles al ruido.", "Som: volume moderado (como numa conversa, sem colunas potentes); escolham o nível de ferocidade pelo mais pequeno do grupo e reservem um canto sossegado para crianças sensíveis ao ruído.", "Ton: moderate Lautstärke (Gesprächslautstärke, keine lauten Lautsprecher); die Wildheitsstufe nach dem jüngsten Kind der Gruppe wählen und eine ruhige Ecke für lärmempfindliche Kinder einrichten.", "Hang: mérsékelt hangerő (beszélgetési szint, nincs hangos hangfal); a vadsági szintet a csoport legfiatalabb gyerekéhez válasszátok, és tartsatok fenn egy csendes sarkot a zajérzékeny gyerekeknek."],

 const o=c.createOscillator();o.type=v.wave;o.frequency.setValueAtTime(f0*(v.drop?1.5:1),t0);o.frequency.exponentialRampToValueAtTime(f0*(v.drop?.6:1.12),t0+dur*.5);o.frequency.exponentialRampToValueAtTime(f0*(scare<.4?1.6:.7),t0+dur);

function setHash(h){try{history.replaceState(null,"",h?("#"+h):(location.pathname+location.search))}catch(e){}}
function openViewer(m,i,share){
 const was=!!V;V={m:m,i:i,paused:reduceMotion(),share:!!share,d3:false,opener:document.activeElement,pushed:was?V.pushed:false};if(!was){try{history.pushState({mv:1},"",location.pathname+location.search+location.hash);V.pushed=true}catch(e){}}try{const w=document.querySelector(".wrap");w.setAttribute("aria-hidden","true");if("inert" in w)w.inert=true}catch(e){}
 $("#vw").hidden=false;document.body.classList.add("vwo");paintViewer();
 try{$("#vwClose").focus()}catch(e){}

function paintViewer(){
 if(!V)return;
 const m=V.m,i=V.i,d=i>=0?DS[i]:null,idx=animIdx(m);
 if(V.d3)paint3D();else{G3.stop();$("#vStage").innerHTML=svgMonster(m,{stage:1,idx:idx});
 $("#vStage svg").setAttribute("class","an-"+idx+(V.paused?" pz":""));rateAnim()}
 $("#vwT").textContent=m.name;
 $("#vNo").textContent=i>=0?("#"+(i+1)+" / "+DS.length):"";
 $("#vTg").textContent=d?pick8(TG[i]):"";
 $("#vTr").innerHTML='<b>'+esc(t("p_mech"))+':</b> '+esc(pick8(ME[m.me||0]));

 $("#vwClose").setAttribute("aria-label",t("v_close"));
 $("#vPrev").hidden=$("#vNext").hidden=i<0;
 $("#vPrev").setAttribute("aria-label",t("v_prevb"));$("#vNext").setAttribute("aria-label",t("v_nextb"));
 $("#vBar").innerHTML='<button class="primary" data-act="vplay" type="button">'+esc(t("v_trick"))+'</button>'+(canFS()?'<button data-act="vfull" type="button">'+esc(t("v_full"))+'</button>':'')+(i>=0?'<button data-act="vcard" type="button">'+esc(t("v_card"))+'</button>':'')+'<button data-act="vshare" type="button" aria-expanded="'+(!!V.share)+'">'+esc(t("v_share"))+'</button>'+'<button data-act="vroar" type="button">'+esc(t("vz_roar"))+'</button><button data-act="vhum" type="button">'+esc(t("vz_hum"))+'</button><button data-act="v3d" type="button" aria-pressed="'+V.d3+'">'+esc(V.d3?t("vz_2d"):t("vz_3d"))+'</button>'+sndCtl();
 const sh=$("#vShare");sh.hidden=!V.share;if(V.share)paintShare();
 setHash(i>=0?SLUGS[i]:"c="+encMon(m));

function canFS(){const e=document.documentElement;return !!(document.fullscreenEnabled||document.webkitFullscreenEnabled)&&!!(e.requestFullscreen||e.webkitRequestFullscreen)}
function paint3D(){
 const st=$("#vStage");st.innerHTML='<canvas id="v3" tabindex="0" role="img" aria-label="'+esc(t("vz_3dl").replace("{name}",V.m.name))+'"></canvas><div class="v3h">'+esc(t("vz_drag"))+'</div>';
 const cv=$("#v3");let ok=false;try{ok=G3.start(cv,V.m)}catch(e){ok=false}
 if(ok){cv.addEventListener("webglcontextlost",e=>{e.preventDefault();if(G3.cv!==cv||!G3.active)return;G3.stop();if(V&&V.d3){V.d3=false;paintViewer()}})}
 if(!ok){G3.stop();st.innerHTML='<p class="v3n">'+esc(t("vz_no3d"))+'</p>';return}
 if(reduceMotion())G3.auto=false;
 cv.addEventListener("keydown",e=>{const k=e.key;if(k==="ArrowLeft"||k==="ArrowRight"||k==="ArrowUp"||k==="ArrowDown"||k==="+"||k==="-"){e.preventDefault();e.stopPropagation();G3.auto=false;G3.dirty=true;
  if(k==="ArrowLeft")G3.yaw-=.25;else if(k==="ArrowRight")G3.yaw+=.25;else if(k==="ArrowUp")G3.pitch=cl(G3.pitch-.15,-.15,1.1);else if(k==="ArrowDown")G3.pitch=cl(G3.pitch+.15,-.15,1.1);else G3.zoom=cl(G3.zoom*(k==="+"?.9:1.1),1.8,10)}});
}
function revealShare(){const sh=$("#vShare");if(!sh)return;sh.setAttribute("tabindex","-1");const go=()=>{try{sh.scrollIntoView({behavior:reduceMotion()?"auto":"smooth",block:"start"})}catch(e){sh.scrollIntoView()}try{sh.focus({preventScroll:true})}catch(e){}};go();setTimeout(go,60)}
function paintShare(){
 const si=shareInfo(),e=encodeURIComponent,u=si.prev,tx=si.text;
 const nets=[["WhatsApp","https://wa.me/?text="+e(tx+" "+u)],["Telegram","https://t.me/share/url?url="+e(u)+"&text="+e(tx)],["Facebook","https://www.facebook.com/sharer/sharer.php?u="+e(u)+"&quote="+e(tx)],["X","https://twitter.com/intent/tweet?text="+e(tx)+"&url="+e(u)],["LinkedIn","https://www.linkedin.com/sharing/share-offsite/?url="+e(u)],["Reddit","https://www.reddit.com/submit?url="+e(u)+"&title="+e(si.title)],[t("v_mail"),"mailto:?subject="+e(si.title)+"&body="+e(tx+"\n\n"+u)]];
 let h='<label for="vsU1">'+esc(t("v_perma"))+'</label><div class="rw2"><input type="text" id="vsU1" readonly value="'+esc(si.perma)+'"><button data-act="vcopy" data-u="'+esc(si.perma)+'" type="button">'+esc(t("copy"))+'</button></div>';
 if(si.prev!==si.perma)h+='<label for="vsU2">'+esc(t("v_prev"))+'</label><div class="rw2"><input type="text" id="vsU2" readonly value="'+esc(si.prev)+'"><button data-act="vcopy" data-u="'+esc(si.prev)+'" type="button">'+esc(t("copy"))+'</button></div>';
 h+='<p style="margin:8px 0 0">'+esc(tx)+'</p><div class="chips">'+nets.map(n=>'<a class="btn ch" href="'+esc(n[1])+'" target="_blank" rel="noopener noreferrer">'+esc(n[0])+'</a>').join("")+'</div><div class="row">'+
  (navigator.share?'<button class="primary" data-act="vnative" type="button">'+esc(t("v_native"))+'</button>':'')+'<button data-act="vpng" type="button">'+esc(t("v_png"))+'</button></div>';
 $("#vShare").innerHTML=h;

let BACKING=false;
function closeViewer(fromPop){
 if(!V)return;const i=V.i,op=V.opener,pushed=V.pushed&&fromPop!==true;V=null;G3.stop();AU.stopHum();try{const w=document.querySelector(".wrap");w.removeAttribute("aria-hidden");if("inert" in w)w.inert=false;if(op&&op.focus&&document.contains(op))op.focus({preventScroll:true})}catch(e){}
 $("#vw").hidden=true;document.body.classList.remove("vwo");$("#vStage").innerHTML="";
 try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}
 if(pushed){BACKING=true;try{history.back()}catch(e){BACKING=false;setHash("")}}else setHash("");
 if(i>=0&&curTab==="bes"){const el=document.getElementById(SLUGS[i]);if(el){try{el.scrollIntoView({block:"start"})}catch(e){}}}
}
function openCard(i){besF="all";closeViewer();renderBes();showTab("bes");const el=document.getElementById(SLUGS[i]);if(el){el.classList.add("hl");const go=()=>{try{el.scrollIntoView({block:"start",behavior:"auto"})}catch(x){el.scrollIntoView()}};go();setTimeout(go,80);setTimeout(go,350);setTimeout(()=>el.classList.remove("hl"),2600)}}
function wrapText(x,txt,x0,y,maxW,lh){const words=String(txt).split(" ");let line="";words.forEach(w=>{const test=line?line+" "+w:w;if(x.measureText(test).width>maxW&&line){x.fillText(line,x0,y);line=w;y+=lh}else line=test});if(line){x.fillText(line,x0,y);y+=lh}return y}
function monsterPNG(m,sub,cb){
 try{
  const svg=svgMonster(m).replace("<svg ",'<svg xmlns="http://www.w3.org/2000/svg" width="560" height="532" ');
  const img=new Image();
  img.onload=()=>{try{
   const c=document.createElement("canvas");c.width=1200;c.height=630;const x=c.getContext("2d");
   const g=x.createLinearGradient(0,0,1200,630);g.addColorStop(0,"#fff8e7");g.addColorStop(1,"#e9dcff");x.fillStyle=g;x.fillRect(0,0,1200,630);
   x.drawImage(img,30,48,560,532);
   x.textBaseline="alphabetic";x.fillStyle="#7c3aed";x.font="700 30px system-ui,sans-serif";x.fillText("MONSTRARIUM",620,90);
   x.fillStyle="#2b2340";let fs=92;x.font="800 "+fs+"px system-ui,sans-serif";while(x.measureText(m.name).width>540&&fs>40){fs-=4;x.font="800 "+fs+"px system-ui,sans-serif"}
   x.fillText(m.name,620,190);
   x.fillStyle="#5b5275";x.font="500 32px system-ui,sans-serif";let y=wrapText(x,sub||pick8(ME[m.me||0]),620,250,540,42);
   x.fillStyle="#15803d";x.font="700 33px system-ui,sans-serif";wrapText(x,t("sh_cta"),620,y+22,540,44);
   x.fillStyle="#6d6585";x.font="500 24px system-ui,sans-serif";x.fillText(SITE.replace(/^https?:\/\//,"").replace(/\/$/,""),620,596);
   c.toBlob(cb,"image/png");
  }catch(e){cb(null)}};
  img.onerror=()=>cb(null);
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
 }catch(e){cb(null)}
}
function pngSub(){return V.i>=0?pick8(TG[V.i]):pick8(ME[V.m.me||0])}
function route(){
 const h=(location.hash||"").replace(/^#/,"");if(!h)return;
 if(h.indexOf("c=")===0){const m=decMon(h.slice(2).split("&")[0]);if(m)openViewer(m,-1,false);return}
 const i=SLUGS.indexOf(h.split("&")[0]);
 if(i>=0){besF="all";if(curTab!=="bes"){renderBes();showTab("bes")}openViewer(designMon(DS[i]),i,false)}
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]");if(!b)return;
 const a=b.dataset.act;
 if(a==="tab")showTab(b.dataset.v);
 else if(a==="lang"){li=LANGS.indexOf(b.dataset.v);S.lang=b.dataset.v;save();renderAll();if(V)paintViewer()}
 else if(a==="print")window.print();
 else if(a==="col"){const id=b.dataset.id;S.col[id]=Math.max(0,(Number(S.col[id])||0)+Number(b.dataset.d));save();renderMat()}
 else if(a==="resetcol"){const now=Date.now();if(b.dataset.arm&&now-(+b.dataset.arm)<5000){S.col={};save();renderMat()}else{b.dataset.arm=String(now);const o=b.textContent;b.textContent="⚠ "+t("confirmReset");b.setAttribute("role","alert");setTimeout(()=>{if(b.isConnected){b.textContent=o;delete b.dataset.arm;b.removeAttribute("role")}},5000)}}
 else if(a==="copy"){
  const txt=msgText();
  const done=()=>{b.textContent=t("copied");setTimeout(()=>{b.textContent=t("copy")},1500)};
  try{navigator.clipboard.writeText(txt).then(done,()=>fb())}catch(x){fb()}
  function fb(){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(x){}document.body.removeChild(ta);done()}
 }
 else if(a==="openbes"){besF="all";renderBes();showTab("bes");const el=document.getElementById("b"+b.dataset.n);if(el){el.classList.add("hl");try{el.scrollIntoView({block:"start",behavior:"smooth"})}catch(x){el.scrollIntoView()}setTimeout(()=>el.classList.remove("hl"),2600)}}
 else if(a==="view"){const i=+b.dataset.i;if(i>=0&&i<DS.length){openViewer(designMon(DS[i]),i,!!b.dataset.share);if(V&&!b.dataset.share)AU.roar(V.m)}}
 else if(a==="viewc"){const m=decMon(b.dataset.code);if(m){openViewer(m,-1,!!b.dataset.share);if(V&&!b.dataset.share)AU.roar(V.m)}}
 else if(a==="vclose")closeViewer();
 else if(a==="vprev"||a==="vnext"){if(V&&V.i>=0){V.i=(V.i+(a==="vnext"?1:DS.length-1))%DS.length;V.m=designMon(DS[V.i]);V.paused=reduceMotion();paintViewer();AU.roar(V.m)}}
 else if(a==="vplay"){if(V){AU.roar(V.m);V.paused=false;const sv=$("#vStage svg");if(sv){const c=sv.getAttribute("class").replace(/\s*pz/,"");sv.setAttribute("class","");void sv.getBoundingClientRect();sv.setAttribute("class",c)}}}
 else if(a==="vfull"){const el=$("#vw");try{if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);else{const r=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);if(r&&r.catch)r.catch(()=>{})}}catch(x){}}
 else if(a==="vcard"){if(V&&V.i>=0)openCard(V.i)}
 else if(a==="vshare"){if(V){V.share=!V.share;const sh=$("#vShare");sh.hidden=!V.share;b.setAttribute("aria-expanded",String(V.share));if(V.share){paintShare();revealShare()}}}
 else if(a==="vcopy")copyText(b.dataset.u,b);
 else if(a==="vpng"||a==="vnative"){if(!V)return;const si=shareInfo(),m=V.m;monsterPNG(m,pngSub(),blob=>{
   if(a==="vpng"){if(!blob)return;try{const u=URL.createObjectURL(blob),l=document.createElement("a");l.href=u;l.download="monstrarium-"+m.name.toLowerCase().replace(/[^a-z0-9]+/g,"-")+".png";document.body.appendChild(l);l.click();document.body.removeChild(l);setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(e){}}
   else{const data={title:si.title,text:si.text,url:si.prev};try{if(blob){const f=new File([blob],"monstrarium.png",{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[f]}))data.files=[f]}}catch(e){}try{navigator.share(data).catch(()=>{})}catch(e){}}
  })}
 else if(a==="vroar"){if(V)AU.roar(V.m)}
 else if(a==="vhum"){if(V)AU.hum(V.m)}
 else if(a==="v3d"){if(V){V.d3=!V.d3;paintViewer()}}
 else if(a==="roarb"||a==="humb"){const m=monOfBtn(b);if(m){if(a==="roarb")AU.roar(m);else AU.hum(m)}}
 else if(a==="gmode")gStart(b.dataset.v);
 else if(a==="gmenu"){GM.mode=null;GM.note=false;GM.tok++;AU.stopHum();renderGame()}
 else if(a==="gans")gAns(+b.dataset.i);
 else if(a==="gnext")gNext();
 else if(a==="gplay")gPlay();
 else if(a==="gflip")gFlip(+b.dataset.i);
 else if(a==="besf"){besF=b.dataset.v;renderBes()}
 else if(a==="newmon"){oneSeed=Math.floor(Math.random()*1e6);ED=null;renderOne()}
 else if(a==="edreroll"){oneSeed=Math.floor(Math.random()*1e6);ED=applyLocks(genMonster(oneSeed),ED);renderOne()}
 else if(a==="edbes"){oneSeed=Math.floor(Math.random()*1e6);ED=applyLocks(remixMon(oneSeed),ED);renderOne()}
 else if(a==="edmut"){ED=mutateMon(ED,rng(Math.floor(Math.random()*1e9)));renderOne()}
 else if(a==="edfeat"){const k=b.dataset.f,i=ED.f.indexOf(k);if(i>=0)ED.f.splice(i,1);else if(ED.f.length<4)ED.f.push(k);fixMin(ED,0);renderOne()}
 else if(a==="edload"){const m=decMon($("#edCode").value);if(m){ED=m;renderOne()}else{const g=$("#edMsg");if(g){g.textContent=t("g_bad");setTimeout(()=>{g.textContent=""},2200)}}}
 else if(a==="edcopy")copyText(encMon(ED),b);
 else if(a==="csv")csvDownload();
 else if(a==="albprint")window.print();
 else if(a==="albparade")albParade();
 else if(a==="allcards"){showAll=true;renderAllCards()}
});
document.addEventListener("input",e=>{
 const el=e.target,k=el.dataset.key;
 if(el.dataset.snd==="vol"){S.vol=cl(Math.round(+el.value)||0,0,100);AU.setVol();document.querySelectorAll('input[data-snd="vol"]').forEach(x=>{if(x!==el)x.value=S.vol});save();return}
 if(el.dataset.ed){edSet(el);return}
 if(el.dataset.lock){LK[el.dataset.lock]=el.checked;return}
 if(k==="gl"||k==="gs"||k==="gst"){S[k]=el.type==="checkbox"?el.checked:el.value;save();BC.key="";if(showAll)renderAllCards();return}
 if(el.dataset.names){S.names=el.value;save();clearTimeout(dipTimer);dipTimer=setTimeout(()=>{renderDip();if(curTab==="alb")renderAlb()},250);return}
 if(!k||k==="lean")return;
 if(k==="place"||k==="deadline"){S[k]=el.value;save();const mt=$("#msgTxt");if(mt)mt.textContent=msgText();return}
 const v=Math.round(Number(el.value));
 if(k==="seed"){if(v>=1&&v<=999999){S.seed=v;save();if(showAll)renderAllCards();renderDip()}return}
 const r=PRESETS[k];if(!r)return;
 if(isFinite(v)&&v>=r[0]&&v<=r[1]){S[k]=v;save();refreshDerived()}
});
document.addEventListener("change",e=>{
 const el=e.target;
 if(el.dataset.snd==="vol"){save();return}
 if(el.dataset.snd){const k=el.dataset.snd;if(k==="on"){S.snd=el.checked;if(!el.checked)AU.stopHum()}else if(k==="age"){S.age=cl(+el.value||2,1,4);save();applyAge()}else if(k==="gen"){S.ggen=el.checked;GM.pool=[]}save();
  if(k==="gen")renderGame();if(k==="on"||k==="age"){document.querySelectorAll('[data-snd="on"]').forEach(x=>{x.checked=S.snd!==false});document.querySelectorAll('select[data-snd="age"]').forEach(x=>{x.value=S.age});}return}
 if(el.dataset.ed||el.dataset.lock||["gl","gs","gst"].indexOf(el.dataset.key)>=0)return;
 if(el.dataset.key==="lean"){S.lean=el.checked;save();refreshDerived();if(curTab!=="mat")renderMat();renderMon();return}
 if(el.dataset.key==="place"||el.dataset.key==="deadline"){return}
 if(el.dataset.key&&el.dataset.key!=="seed"){const k=el.dataset.key;S[k]=clamp(k,el.value);el.value=S[k];save();refreshDerived()}
 else if(el.dataset.key==="seed"){let v=Math.round(Number(el.value));if(!(v>=1&&v<=999999))v=1;S.seed=v;el.value=v;save();if(showAll)renderAllCards();renderDip()}
 else if(el.dataset.tl){S.tl[el.dataset.tl]=el.checked;save()}
 else if(el.dataset.col){S.col[el.dataset.col]=Math.max(0,Math.round(Number(el.value))||0);save();renderMat()}
});
window.addEventListener("beforeprint",()=>{});
document.addEventListener("visibilitychange",()=>{if(document.hidden){AU.stopHum();try{if(AU.ctx&&AU.ctx.state==="running")AU.ctx.suspend()}catch(e){}}});
window.addEventListener("pagehide",()=>{AU.stopHum();G3.stop()});
window.addEventListener("popstate",()=>{if(BACKING){BACKING=false;setHash("");return}if(V&&V.pushed)closeViewer(true)});
window.addEventListener("hashchange",()=>{if(!location.hash&&V){return}route()});
document.addEventListener("keydown",e=>{
 if(!V)return;
 if(e.target&&/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)&&e.key!=="Escape"&&e.key!=="Tab")return;
 if(e.key==="Escape"){if(!document.fullscreenElement)closeViewer()}
 else if(e.key==="ArrowRight"&&V.i>=0)$("#vNext").click();
 else if(e.key==="ArrowLeft"&&V.i>=0)$("#vPrev").click();
 else if(e.key==="Tab"){const f=[...$("#vw").querySelectorAll("button:not([hidden]),a[href],input,select")].filter(x=>!x.closest("[hidden]")&&!x.hidden);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});
try{if("scrollRestoration" in history)history.scrollRestoration="manual"}catch(e){}
renderAll();G3.rot=agep().rot;route();
try{if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
